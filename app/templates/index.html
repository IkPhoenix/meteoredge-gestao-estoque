<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeteorEdge | Gestão de Estoque</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><header><strong>☄ MeteorEdge <span>Collectibles</span></strong><h1>Gestão de Estoque</h1><small>Protótipo local — sem autenticação</small></header>
<div class="layout"><nav aria-label="Menu principal"><button data-screen="menu">Menu principal</button><button data-screen="saida">Saída de estoque</button></nav>
<main id="content" tabindex="-1"><section id="menu"><h2>Bem-vindo ao sistema</h2><p>Gerencie produtos, lotes e movimentações.</p><button class="primary" data-screen="saida">Saída de estoque</button></section>
<section id="saida" hidden><h2>Saída de estoque</h2><p>Selecione o lote e informe a quantidade a retirar.</p><form id="saida-form"><label for="lote">Lote</label><select id="lote" required></select><p id="detalhes" aria-live="polite"></p><label for="quantidade">Quantidade a retirar</label><input id="quantidade" type="number" min="1" step="1" required><button class="primary" type="submit">Confirmar saída</button><button type="button" data-screen="menu">Cancelar</button></form></section>
<section id="resultado" hidden><h2>Resultado da movimentação</h2><p id="mensagem" role="status"></p><p id="saldo"></p><button class="primary" data-screen="saida">Nova saída</button><button data-screen="menu">Voltar ao menu</button></section></main></div>
<script src="/static/js/app.js" defer></script></body></html>
